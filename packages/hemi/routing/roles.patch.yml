# Native Hemi role presets share a capability tree and retain their own persona.
- insert:
    - id: preset-hemi-explorer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: explorer
        subagentOnly: true
        name: 侦察
        description: "Role: explorer. Gather read-only context from code, documentation and references. Report facts, options and risks. Make no changes."
        order: 20
        plugins:
            - id: persona
              name: '@deepseek-ai/dsh-persona'
              config:
                prefix: "Role: explorer. Gather read-only context from code, documentation and references. Report facts, options and risks. Make no changes."
            - &hemi-role-capabilities
              id: capabilities
              name: cordis:group
              group: true
              config:
                - id: agent-instructions
                  name: '@deepseek-ai/dsh-agent-instructions'
                  config:
                    maxBytes: 65536
                - id: time-context
                  name: '@deepseek-ai/dsh-time-context'
                - id: tool-bash
                  name: '@deepseek-ai/dsh-tool-bash'
                  disabled: !!js process.platform === 'win32'
                - id: tool-pwsh
                  name: '@deepseek-ai/dsh-tool-pwsh'
                  disabled: !!js process.platform !== 'win32'
                - id: tool-fs
                  name: '@deepseek-ai/dsh-tool-fs'
                  config:
                    applyPatch: false
                - id: tool-fs-search
                  name: '@deepseek-ai/dsh-tool-fs-search'
                  config:
                    sampleOverCapGlobResults: false
                - id: tool-subagent-control
                  name: '@deepseek-ai/dsh-tool-subagent-control'
                - id: tool-subagent
                  name: '@deepseek-ai/dsh-tool-subagent'
                  config:
                    provider: spawn
                    allowedAgentPresets: [explorer, oracle, fixer, designer]
                - id: skill-filesystem
                  name: '@deepseek-ai/dsh-skill-filesystem'
                - id: tool-skill
                  name: '@deepseek-ai/dsh-tool-skill'
                - id: compaction
                  name: cordis:group
                  group: true
                  isolate:
                    compaction: true
                  config:
                    - id: compaction-basic
                      name: '@deepseek-ai/dsh-compaction-basic'
                    - id: command-compact
                      name: '@deepseek-ai/dsh-command-compact'
    - id: preset-hemi-oracle
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: oracle
        subagentOnly: true
        name: 分析
        description: "Role: oracle. Analyze independently, challenge assumptions and report conclusions, trade-offs and failure modes."
        order: 21
        plugins:
            - id: persona
              name: '@deepseek-ai/dsh-persona'
              config:
                prefix: "Role: oracle. Analyze independently, challenge assumptions and report conclusions, trade-offs and failure modes."
            - *hemi-role-capabilities
    - id: preset-hemi-fixer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: fixer
        subagentOnly: true
        name: 执行
        description: "Role: fixer. Carry out the scoped implementation, run checks and report verified results and remaining gaps."
        order: 22
        plugins:
            - id: persona
              name: '@deepseek-ai/dsh-persona'
              config:
                prefix: "Role: fixer. Carry out the scoped implementation, run checks and report verified results and remaining gaps."
            - *hemi-role-capabilities
    - id: preset-hemi-designer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: designer
        subagentOnly: true
        name: 设计
        description: "Role: designer. Design and implement the interface with deliberate layout, hierarchy, typography and responsive behavior."
        order: 23
        plugins:
            - id: persona
              name: '@deepseek-ai/dsh-persona'
              config:
                prefix: "Role: designer. Design and implement the interface with deliberate layout, hierarchy, typography and responsive behavior."
            - *hemi-role-capabilities
