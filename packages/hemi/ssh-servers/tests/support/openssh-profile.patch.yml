# Real Web profile services with only isolated test transport and execution-policy choices.
- id: hmr
  disabled: true
- id: hemi-ssh-servers
  disabled: false
- id: hemi-ssh-workspaces
  disabled: false
- id: session-title-llm
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.DSH_HOME
- id: hemi-routing-settings
  config:
    newSessionMode: fixed
    newSessionEffort: null
