# Install into a profile without the built-in Hemi backup rows. The backup
# orchestrator belongs at root scope; the settings section contributes through
# the independent settings page slot. skillMaxBytes keeps its plugin default (5 MB).
- insert:
    - id: hemi-backup
      name: '@deepseek-ai/dsh-hemi-backup'
    - id: hemi-backup-ui
      name: '@deepseek-ai/dsh-hemi-backup-ui'
